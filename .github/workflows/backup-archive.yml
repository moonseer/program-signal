name: Backup archive

on:
  schedule:
    - cron: "0 7 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create archive
        run: |
          chmod +x scripts/create-backup-archive.sh
          ./scripts/create-backup-archive.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: program-signal-backup-${{ github.run_id }}
          path: backups/
          retention-days: 90

      - name: Reminder
        run: |
          echo "Actions artifacts are convenience only (90-day retention)."
          echo "Download and store off GitHub per docs/standards/BACKUP.md."
