primary_question: Why did MCP gateway demand appear now, what does a gateway actually centralize, and what can it not?
reader_problem: MCP gateway is being treated as a category you must buy, not as a set of functions that may already live in the harness or the mesh.
central_thesis: The demand is real. A gateway is not automatically the right control point.
why_now: Gateway products are appearing as the default answer to MCP security before the failure modes of a proxy layer are named.
unique_angle: Signal-shaped analysis of demand vs control point, dated and uncertain where the landscape is moving.
