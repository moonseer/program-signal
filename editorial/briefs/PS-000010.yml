primary_question: What do agents change in golden paths, self-service, and control planes — and which platform jobs must stay human?
reader_problem: Agentic platform engineering currently means either a chatbot on the portal or a rewrite of the platform as autonomous agents.
central_thesis: Agents may assist platform products. They must not autonomously own control-plane decisions that define blast radius.
why_now: Platform engineering is being rebranded as agentic without a definition of what agents change.
unique_angle: What agents may do inside a platform product, and which control-plane decisions stay human.
