  - source_id: SRC-OTEL-001
    title: Semantic conventions for generative client AI spans
    organization: OpenTelemetry
    url: https://github.com/open-telemetry/semantic-conventions-genai/blob/main/docs/gen-ai/gen-ai-spans.md
    type: specification
    tier: 1
    topics:
      - observability
      - ai-agents
    notes: Status Development. Defines GenAI spans for inference and execute_tool (gen_ai.operation.name, gen_ai.provider.name). Content capture is opt-in. Not a vendor observability product.
  - source_id: SRC-OTEL-002
    title: Traces
    organization: OpenTelemetry
    url: https://opentelemetry.io/docs/concepts/signals/traces/
    type: official_docs
    tier: 1
    topics:
      - observability
    notes: A trace is correlated spans across processes, with context, hierarchy, and status. A chat log is not that.
  - source_id: SRC-PAL-001
    title: Dev versus Delta
    organization: Palantir
    url: https://blog.palantir.com/dev-versus-delta-demystifying-engineering-roles-at-palantir-ad44c2a6e87
    type: official_docs
    tier: 1
    topics:
      - platform-engineering
    published_at: "2019-04-08"
    notes: Palantir names Forward Deployed Software Engineers Deltas. Deltas sit in Business Development, support one customer with many capabilities, and deploy Palantir platforms. Palantir says this is not consulting. Distinct from Devs (one capability, many customers).
  - source_id: SRC-OAI-001
    title: Forward Deployed Engineer (FDE) - SF
    organization: OpenAI
    url: https://openai.com/careers/forward-deployed-engineer-%28fde%29-sf-san-francisco/
    type: official_docs
    tier: 1
    topics:
      - platform-engineering
    notes: Official OpenAI careers listing. FDEs lead end-to-end deployments of frontier models. They own discovery, technical scoping, system design, build, and production rollout. Success is production adoption and eval-driven feedback into product and model roadmaps. Up to 50 percent travel. Not a Palantir platform-customization job.
  - source_id: SRC-ANTH-001
    title: Forward Deployed Engineer
    organization: Anthropic
    url: https://job-boards.greenhouse.io/anthropic/jobs/5391021008
    type: official_docs
    tier: 1
    topics:
      - platform-engineering
    notes: Official Anthropic Greenhouse listing. FDEs sit on the Applied AI team, embed with strategic customers, accelerate adoption of existing products, and create new applications on Anthropic models. 4-plus years in a technical customer-facing role. Job IDs rotate; quote the listing, not a frozen industry definition.
  - source_id: SRC-AWS-001
    title: Maximizing your cloud journey
    organization: Amazon Web Services
    url: https://aws.amazon.com/blogs/training-and-certification/engaging-a-solutions-architect/
    type: official_docs
    tier: 1
    topics:
      - platform-engineering
    notes: Official AWS Training blog. An AWS Solutions Architect is a technical advisor, customer advocate, and educator. Work includes Well-Architected reviews and whiteboarding. Hands-on implementation is routed to Professional Services or partners. Ongoing management is a customer vs Managed Services choice, not SA ownership. Not an FDE or platform-engineer job.
  - source_id: SRC-K8S-003
    title: Gateway API introduction
    organization: Kubernetes SIG Network
    url: https://gateway-api.sigs.k8s.io/docs/introduction/
    type: official_docs
    tier: 1
    topics:
      - kubernetes
    notes: Kubernetes Gateway API models L4 and L7 service networking (Ingress, load balancing, mesh). It is not an MCP product. The docs distinguish Gateway API from an API gateway. Some API gateways can be programmed with Gateway API. Do not treat MCP gateway products as this control point.
  - source_id: SRC-DOCKER-001
    title: Docker MCP Gateway
    organization: Docker
    url: https://www.docker.com/blog/docker-mcp-gateway-secure-infrastructure-for-agentic-ai/
    type: official_docs
    tier: 1
    topics:
      - ai-agents
      - security
    published_at: "2025-07-09"
    notes: Official Docker Blog, 2025-07-09. Open-sources MCP Gateway as a secure enforcement point between agents and MCP servers. Aggregates servers behind one interface. Features include signature verification, secret blocking, and call logging. Available in Docker Desktop and as open source. Dated vendor announcement, not a frozen category definition.
  - source_id: SRC-CF-001
    title: Introducing Cloudflare MCP Server Portals
    organization: Cloudflare
    url: https://blog.cloudflare.com/zero-trust-mcp-server-portals/
    type: official_docs
    tier: 1
    topics:
      - ai-agents
      - security
    published_at: "2025-08-26"
    notes: Official Cloudflare Blog. MCP Server Portals in Open Beta as part of Cloudflare One. Centralizes MCP connections for policy, logging, and a single portal endpoint. Changelog dates the release 2025-08-26. Product name is Portal, not Gateway. Dated vendor announcement, not a frozen category definition.
  - source_id: SRC-CNCF-003
    title: CNCF and SlashData Q1 2026 Technology Radar
    organization: CNCF
    url: https://www.cncf.io/announcements/2026/03/24/cncf-and-slashdata-report-finds-platform-engineering-tools-maturing-as-organizations-prepare-for-ai-driven-infrastructure/
    type: official_docs
    tier: 1
    topics:
      - platform-engineering
    published_at: "2026-03-24"
    notes: Official CNCF announcement, 2026-03-24. Q1 2026 Technology Radar with SlashData. Survey of 400-plus developers in Q4 2025. Among respondents, 28 percent report a dedicated platform team, 41 percent a multi-team IDP model, 35 percent a hybrid platform for AI workloads. Helm, Backstage, and kro placed in Adopt for application delivery. This is a dated survey of tooling maturity, not a blast-radius study of unattended agent tool access. Do not treat it as the universal state of the industry.
  - source_id: SRC-PUPPET-001
    title: "State of DevOps Report: Platform Engineering Edition 2026"
    organization: Perforce / Puppet
    url: https://www.perforce.com/press-releases/state-of-platform-engineering-2026
    type: official_docs
    tier: 1
    topics:
      - platform-engineering
      - ai-agents
    published_at: "2026-07-08"
    notes: Official Perforce press release, 2026-07-08, announcing the State of DevOps Report Platform Engineering Edition 2026, a subset of the annual State of DevOps Report. Survey of 820 technology professionals worldwide. Report landing also at https://www.puppet.com/resources/2026-state-of-platform-engineering. Findings as stated for this sample, not the universal industry. 73 percent of mature platform engineering organizations say platform maturity was a critical or significant factor in AI success, compared with 44 percent of less mature organizations. 66 percent of organizations are using AI in infrastructure and configuration workflows including provisioning, drift detection, and compliance management. 31 percent report fully autonomous AI; 44 percent of IDP-mature organizations run AI workflows fully autonomously, compared with 26 percent still using AI experimentally. Organizations with formal governance report 94 percent trust in AI, compared with 51 percent relying on ad hoc approaches. 79 percent of platform-mature organizations report strong governance automation maturity, compared with 14 percent of immature organizations. 81 percent of mature organizations express high confidence in AI outputs in critical workflows, versus 48 percent of less mature organizations. Organizations with fully standardized IDPs reach 92 percent confidence in AI outputs. 52 percent of organizations have fully automated audit trails. Vendor-sponsored survey. It measures AI in infrastructure, autonomy, platform maturity, and governance. It does not measure MCP tool access or blast radius of unattended agent calls.


