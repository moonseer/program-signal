  - source_id: SRC-CNCF-001
    title: CNCF Platforms White Paper
    organization: CNCF TAG App Delivery
    url: https://tag-app-delivery.cncf.io/whitepapers/platforms/
    type: whitepaper
    tier: 1
    topics:
      - platform-engineering
    notes: Platform as a product. Golden paths are templates, documentation, and onboarding workflows — product surfaces, not autonomous agents.
  - source_id: SRC-CNCF-002
    title: Platform Engineering Maturity Model
    organization: CNCF TAG App Delivery
    url: https://tag-app-delivery.cncf.io/whitepapers/platform-eng-maturity-model/
    type: whitepaper
    tier: 1
    topics:
      - platform-engineering
    notes: Investment as product and golden-path templates as self-serve surfaces. Does not assign control-plane ownership to agents.
  - source_id: SRC-OTEL-001
    title: Semantic conventions for generative client AI spans
    organization: OpenTelemetry
    url: https://github.com/open-telemetry/semantic-conventions-genai/blob/main/docs/gen-ai/gen-ai-spans.md
    type: specification
    tier: 1
    topics:
      - observability
      - ai-agents
    notes: Status Development. Defines GenAI spans for inference and execute_tool (gen_ai.operation.name, gen_ai.provider.name). Content capture is opt-in. Not a vendor observability product.
  - source_id: SRC-OTEL-002
    title: Traces
    organization: OpenTelemetry
    url: https://opentelemetry.io/docs/concepts/signals/traces/
    type: official_docs
    tier: 1
    topics:
      - observability
    notes: A trace is correlated spans across processes, with context, hierarchy, and status. A chat log is not that.
  - source_id: SRC-PAL-001
    title: Dev versus Delta
    organization: Palantir
    url: https://blog.palantir.com/dev-versus-delta-demystifying-engineering-roles-at-palantir-ad44c2a6e87
    type: official_docs
    tier: 1
    topics:
      - platform-engineering
    published_at: "2019-04-08"
    notes: Palantir names Forward Deployed Software Engineers Deltas. Deltas sit in Business Development, support one customer with many capabilities, and deploy Palantir platforms. Palantir says this is not consulting. Distinct from Devs (one capability, many customers).
  - source_id: SRC-OAI-001
    title: Forward Deployed Engineer (FDE) - SF
    organization: OpenAI
    url: https://openai.com/careers/forward-deployed-engineer-%28fde%29-sf-san-francisco/
    type: official_docs
    tier: 1
    topics:
      - platform-engineering
    notes: Official OpenAI careers listing. FDEs lead end-to-end deployments of frontier models. They own discovery, technical scoping, system design, build, and production rollout. Success is production adoption and eval-driven feedback into product and model roadmaps. Up to 50 percent travel. Not a Palantir platform-customization job.
  - source_id: SRC-ANTH-001
    title: Forward Deployed Engineer
    organization: Anthropic
    url: https://job-boards.greenhouse.io/anthropic/jobs/5391021008
    type: official_docs
    tier: 1
    topics:
      - platform-engineering
    notes: Official Anthropic Greenhouse listing. FDEs sit on the Applied AI team, embed with strategic customers, accelerate adoption of existing products, and create new applications on Anthropic models. 4-plus years in a technical customer-facing role. Job IDs rotate; quote the listing, not a frozen industry definition.


