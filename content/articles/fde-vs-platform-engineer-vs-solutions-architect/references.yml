  - source_id: SRC-ANTH-001
    label: PRIMARY_SOURCE
    note: Anthropic FDEs sit on Applied AI, embed with strategic customers, and create new applications on Anthropic models. Job IDs rotate.
  - source_id: SRC-CNCF-001
    label: PRIMARY_SOURCE
    note: Platform as a product. Golden paths are templates, documentation, and onboarding workflows.
  - source_id: SRC-AWS-001
    label: PRIMARY_SOURCE
    note: An AWS Solutions Architect is a technical advisor, customer advocate, and educator. Implementation and ongoing management are routed elsewhere.
