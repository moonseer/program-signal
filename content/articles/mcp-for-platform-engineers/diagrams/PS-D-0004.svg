<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="d4-title d4-desc">
  <title id="d4-title">MCP protocol vs platform operations</title>
  <desc id="d4-desc">An agent host contains an MCP client. JSON-RPC connects to MCP servers with tools and credentials. Platform operations include lifecycle, allow-lists, audit, and reachability. MCP does not include the model, harness, or full platform policy.</desc>
  <defs>
    <marker id="d4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5" fill="none" stroke="currentColor" stroke-width="1.5" />
    </marker>
  </defs>
  <rect class="band" x="24" y="24" width="232" height="232" rx="8" />
  <rect class="node" x="44" y="44" width="192" height="88" rx="6" />
  <rect class="node" x="44" y="156" width="192" height="72" rx="6" />
  <rect class="node node-focus" x="444" y="44" width="292" height="100" rx="6" />
  <rect class="node" x="444" y="168" width="292" height="88" rx="6" />
  <rect class="node" x="444" y="280" width="292" height="68" rx="6" />
  <path class="connector" marker-end="url(#d4-arrow)" d="M236 192 L444 94" />
  <text class="label" x="140" y="78" text-anchor="middle">Agent host</text>
  <text class="sublabel" x="140" y="98" text-anchor="middle">user-facing application</text>
  <text class="label" x="140" y="190" text-anchor="middle">MCP client</text>
  <text class="sublabel" x="140" y="208" text-anchor="middle">invokes tools</text>
  <text class="edge-label" x="340" y="132" text-anchor="middle">JSON-RPC</text>
  <text class="label-focus" x="590" y="80" text-anchor="middle">MCP server</text>
  <text class="sublabel" x="590" y="100" text-anchor="middle">separate process · tools + credentials</text>
  <text class="label" x="590" y="200" text-anchor="middle">Platform operates</text>
  <text class="sublabel" x="590" y="220" text-anchor="middle">lifecycle, allow-list, reachability, audit</text>
  <text class="label" x="590" y="312" text-anchor="middle">Not MCP</text>
  <text class="sublabel" x="590" y="330" text-anchor="middle">model · harness · policy</text>
</svg>
