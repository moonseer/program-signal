<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="d4-title d4-desc">
  <title id="d4-title">MCP protocol vs platform operations</title>
  <desc id="d4-desc">An agent host contains an MCP client. JSON-RPC connects to MCP servers with tools and credentials. Platform operations include lifecycle, allow-lists, audit, and reachability. MCP does not include the model, harness, or full platform policy.</desc>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <rect x="40" y="40" width="200" height="120" />
    <rect x="40" y="180" width="200" height="56" />
    <rect x="280" y="108" width="120" height="56" />
    <rect x="440" y="40" width="240" height="120" />
    <rect x="440" y="180" width="240" height="120" />
    <rect x="440" y="320" width="240" height="56" />
    <path d="M240 100 L280 136" />
    <path d="M400 136 L440 100" />
  </g>
  <g fill="currentColor" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
    <text x="140" y="72" text-anchor="middle" font-weight="700">Agent host</text>
    <text x="140" y="92" text-anchor="middle" font-size="11">user-facing application</text>
    <text x="140" y="208" text-anchor="middle">MCP client</text>
    <text x="340" y="140" text-anchor="middle">JSON-RPC</text>
    <text x="560" y="72" text-anchor="middle" font-weight="700">MCP server</text>
    <text x="560" y="92" text-anchor="middle" font-size="11">separate process</text>
    <text x="560" y="112" text-anchor="middle" font-size="11">tools + credentials</text>
    <text x="560" y="220" text-anchor="middle" font-weight="700">Platform operates</text>
    <text x="560" y="240" text-anchor="middle" font-size="11">lifecycle, allow-list,</text>
    <text x="560" y="256" text-anchor="middle" font-size="11">reachability, audit</text>
    <text x="560" y="348" text-anchor="middle">Not MCP: model · harness · policy</text>
  </g>
</svg>
