<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="d5-title d5-desc">
  <title id="d5-title">MCP server blast radius</title>
  <desc id="d5-desc">An agent host with an MCP client talks JSON-RPC to an MCP server that holds credentials and tools. The server reaches downstream APIs. Operator controls are identity, secrets, network, and audit. Host placement is VM, container, Kubernetes, or managed.</desc>
  <defs>
    <marker id="d5-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5" fill="none" stroke="currentColor" stroke-width="1.5" />
    </marker>
  </defs>
  <rect class="node" x="32" y="36" width="210" height="120" rx="6" />
  <rect class="node" x="32" y="176" width="210" height="56" rx="6" />
  <rect class="node" x="434" y="36" width="294" height="120" rx="6" />
  <rect class="node node-focus" x="434" y="176" width="294" height="120" rx="6" />
  <rect class="node" x="32" y="268" width="210" height="120" rx="6" />
  <path class="connector" marker-end="url(#d5-arrow)" d="M242 204 L434 96" />
  <path class="connector" marker-end="url(#d5-arrow)" d="M581 156 L581 172" />
  <text class="label" x="137" y="76" text-anchor="middle">Agent host</text>
  <text class="sublabel" x="137" y="96" text-anchor="middle">user / initiator</text>
  <text class="label" x="137" y="210" text-anchor="middle">MCP client</text>
  <text class="edge-label" x="338" y="138" text-anchor="middle">JSON-RPC</text>
  <text class="label" x="581" y="76" text-anchor="middle">MCP server</text>
  <text class="sublabel" x="581" y="96" text-anchor="middle">separate process</text>
  <text class="sublabel" x="581" y="114" text-anchor="middle">tools + credentials</text>
  <text class="label-focus" x="581" y="216" text-anchor="middle">Downstream APIs</text>
  <text class="sublabel" x="581" y="236" text-anchor="middle">blast radius lives here</text>
  <text class="sublabel" x="581" y="254" text-anchor="middle">not in the prompt</text>
  <text class="label" x="137" y="300" text-anchor="middle">Operator controls</text>
  <text class="sublabel" x="137" y="322" text-anchor="middle">identity · secrets</text>
  <text class="sublabel" x="137" y="340" text-anchor="middle">network · audit</text>
  <text class="sublabel" x="137" y="358" text-anchor="middle">host = placement</text>
</svg>
