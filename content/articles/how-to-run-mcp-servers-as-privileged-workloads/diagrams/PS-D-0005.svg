<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="d5-title d5-desc">
  <title id="d5-title">MCP server blast radius</title>
  <desc id="d5-desc">An agent host with an MCP client talks JSON-RPC to an MCP server that holds credentials and tools. The server reaches downstream APIs. Operator controls are identity, secrets, network, and audit. Host placement is VM, container, Kubernetes, or managed.</desc>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <rect x="32" y="36" width="210" height="130" />
    <rect x="32" y="186" width="210" height="52" />
    <rect x="278" y="110" width="120" height="52" />
    <rect x="434" y="36" width="294" height="130" />
    <rect x="434" y="186" width="294" height="130" />
    <rect x="32" y="270" width="210" height="110" />
    <path d="M242 100 L278 136" />
    <path d="M398 136 L434 100" />
  </g>
  <g fill="currentColor" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
    <text x="137" y="68" text-anchor="middle" font-weight="700">Agent host</text>
    <text x="137" y="90" text-anchor="middle" font-size="11">user / initiator</text>
    <text x="137" y="216" text-anchor="middle">MCP client</text>
    <text x="338" y="140" text-anchor="middle">JSON-RPC</text>
    <text x="581" y="68" text-anchor="middle" font-weight="700">MCP server</text>
    <text x="581" y="90" text-anchor="middle" font-size="11">separate process</text>
    <text x="581" y="112" text-anchor="middle" font-size="11">tools + credentials</text>
    <text x="581" y="220" text-anchor="middle" font-weight="700">Downstream APIs</text>
    <text x="581" y="242" text-anchor="middle" font-size="11">blast radius lives here</text>
    <text x="581" y="264" text-anchor="middle" font-size="11">not in the prompt</text>
    <text x="137" y="298" text-anchor="middle" font-weight="700">Operator controls</text>
    <text x="137" y="320" text-anchor="middle" font-size="11">identity · secrets</text>
    <text x="137" y="338" text-anchor="middle" font-size="11">network · audit</text>
    <text x="137" y="360" text-anchor="middle" font-size="11">host = placement</text>
  </g>
</svg>
