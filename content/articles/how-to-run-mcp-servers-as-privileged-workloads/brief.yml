article_id: PS-000009
opportunity_id: PS-O-0009
working_title: How to Run MCP Servers as Privileged Workloads
content_type: operator_guide
author_persona: marcus
secondary_perspective: maya
target_reader:
  - platform engineers
  - SRE
  - security engineers
primary_question: How should an MCP server run as a privileged workload with named identity, authorization, secrets, audit, and a bounded blast radius — regardless of host?
reader_problem: The default path is a process with a token and a tool list. Host choice (VM, container, Kubernetes, managed) is treated as the security model.
central_thesis: "An MCP server is a privileged workload. Treat it like one: identity, network, secrets, audit, and failure domains — not prompt hardening, and not a Kubernetes-only story."
why_now: MCP servers are being pointed at internal APIs, secrets, and production systems with more access than the agents that call them.
unique_angle: An operator guide for identity, authz, secrets, audit, and blast radius that stays host-agnostic. Kubernetes is one host, not the default.
required_sections:
  - why this matters
  - identity and authorization
  - secrets and network
  - audit
  - failure modes
  - recommendation
claims_to_verify:
  - MCP servers can hold credentials distinct from the calling agent
  - MCP authorization is optional; STDIO transports should take credentials from the environment rather than the HTTP OAuth flow
  - MCP servers must not accept tokens that were not issued for the MCP server (token passthrough is forbidden)
required_visuals:
  - blast-radius diagram
target_length: 2400
research_review: mandatory
editorial_decision: APPROVE
refresh_cycle: 60
