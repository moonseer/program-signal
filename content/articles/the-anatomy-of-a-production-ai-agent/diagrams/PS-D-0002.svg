<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" role="img" aria-labelledby="d2-title d2-desc">
  <title id="d2-title">Production agent layer model</title>
  <desc id="d2-desc">Six adjacent layers of a production agent: interface, model, harness, tools, identity, and observability. The harness is the operable center.</desc>
  <rect class="node" x="16" y="52" width="110" height="176" rx="6" />
  <rect class="node" x="138" y="52" width="110" height="176" rx="6" />
  <rect class="node node-focus" x="260" y="24" width="156" height="232" rx="6" />
  <rect class="node" x="428" y="52" width="110" height="176" rx="6" />
  <rect class="node" x="550" y="52" width="96" height="176" rx="6" />
  <rect class="node" x="658" y="52" width="86" height="176" rx="6" />
  <text class="label" x="71" y="108" text-anchor="middle">Interface</text>
  <text class="sublabel" x="71" y="128" text-anchor="middle">task in</text>
  <text class="label" x="193" y="108" text-anchor="middle">Model</text>
  <text class="sublabel" x="193" y="128" text-anchor="middle">tokens</text>
  <text class="label-focus" x="338" y="92" text-anchor="middle">Harness</text>
  <text class="sublabel" x="338" y="114" text-anchor="middle">state</text>
  <text class="sublabel" x="338" y="132" text-anchor="middle">policy</text>
  <text class="sublabel" x="338" y="150" text-anchor="middle">recovery</text>
  <text class="label" x="483" y="108" text-anchor="middle">Tools</text>
  <text class="sublabel" x="483" y="128" text-anchor="middle">MCP etc.</text>
  <text class="label" x="598" y="108" text-anchor="middle">Identity</text>
  <text class="sublabel" x="598" y="128" text-anchor="middle">who acts</text>
  <text class="label" x="701" y="108" text-anchor="middle">Observe</text>
  <text class="sublabel" x="701" y="128" text-anchor="middle">trace</text>
</svg>
