services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: platform_signal
      POSTGRES_PASSWORD: platform_signal
      POSTGRES_DB: editorial
    ports:
      - "5432:5432"
    volumes:
      - editorial_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_signal -d editorial"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  editorial_pgdata:
