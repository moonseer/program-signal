[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "editorial-runtime"
version = "0.3.0"
description = "Platform Signal editorial agent workflow (Phase 1 + LLM wiring + Postgres state)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2.60",
  "psycopg[binary,pool]>=3.2",
  "pydantic>=2.10",
  "pydantic-ai>=0.0.55",
  "python-dotenv>=1.0",
  "pyyaml>=6.0.2",
]

[project.optional-dependencies]
llm = ["litellm>=1.60"]
dev = ["pytest>=8.3"]

[project.scripts]
ps-editorial = "editorial_runtime.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["editorial_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
