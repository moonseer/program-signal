# Capability-based model routing (not per-persona).
# Override any alias with PS_MODEL_<ALIAS> env vars, e.g. PS_MODEL_WRITER=openai:atlas-general
# When using a LiteLLM proxy, set OPENAI_API_BASE / OPENAI_BASE_URL and OPENAI_API_KEY.

research:
  primary: openai:gpt-4o-mini
  fallback: openai:gpt-4o-mini
reasoning:
  primary: openai:gpt-4o-mini
  fallback: openai:gpt-4o-mini
writer:
  primary: openrouter:anthropic/claude-sonnet-4.6
  fallback: openrouter:openai/gpt-4.1
fast:
  primary: openai:gpt-4o-mini
  fallback: openai:gpt-4o-mini
local:
  primary: ollama:llama3.2
